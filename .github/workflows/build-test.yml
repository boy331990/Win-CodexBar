name: Build Desktop Executable

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

concurrency:
  group: build-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build CodexBar Windows Binary
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0

      - name: Install pnpm globally
        shell: pwsh
        run: npm install -g pnpm@11.25.0

      - name: Install frontend dependencies
        shell: pwsh
        working-directory: apps/desktop-tauri
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        shell: pwsh
        working-directory: apps/desktop-tauri
        run: pnpm run build

      - name: Build Tauri desktop binary
        shell: pwsh
        working-directory: apps/desktop-tauri
        run: pnpm exec tauri build --no-bundle --ci

      - name: Prepare artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Get-ChildItem -Path target\ -Filter "*codexbar*.exe" -Recurse | ForEach-Object {
            Write-Host "Found binary: $($_.FullName)"
            Copy-Item -Path $_.FullName -Destination "artifacts\$($_.Name)"
          }

      - name: Upload CodexBar executable
        uses: actions/upload-artifact@v4
        with:
          name: CodexBar-Windows-x64
          path: artifacts/
          retention-days: 7
