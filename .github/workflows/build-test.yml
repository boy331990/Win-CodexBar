name: Build Desktop Executable

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

concurrency:
  group: build-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build CodexBar Windows Binary
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/desktop-tauri/package.json

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: apps/desktop-tauri/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm --dir apps/desktop-tauri install --frozen-lockfile

      - name: Build frontend and desktop binary
        run: pnpm --dir apps/desktop-tauri run tauri:build

      - name: Prepare artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Copy-Item -Path "target\release\codexbar-desktop-tauri.exe" -Destination "artifacts\CodexBar.exe"
          if (Test-Path -LiteralPath "target\release\codexbar.exe") {
            Copy-Item -Path "target\release\codexbar.exe" -Destination "artifacts\codexbar-cli.exe"
          }

      - name: Upload CodexBar executable
        uses: actions/upload-artifact@v4
        with:
          name: CodexBar-Windows-x64
          path: artifacts/
          retention-days: 7
